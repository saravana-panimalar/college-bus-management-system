# Server Port
server.port=8080

# Application Context & JSON Formatting
spring.application.name=college-bus-management
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# ===============================
# DEFAULT: In-Memory H2 Database
# ===============================
spring.datasource.url=jdbc:h2:mem:collegebusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

